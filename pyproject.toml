[project]
name = "superbot"
version = "0.1.0"
description = "Superbot: local-first AI trading research, backtesting and internal simulation"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.100,<1",
    "streamlit>=1.30,<2",
    "plotly>=5,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = ["-q"]
markers = [
    "integration: tests requiring a live MT5 terminal (skipped if unavailable)",
]

[tool.ruff]
line-length = 100
